<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SocialSpace · post photo, link & more</title>
  <!-- Google Fonts + Font Awesome + AOS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #f5f7fb;
      color: #1e2b3c;
      line-height: 1.5;
      padding-bottom: 2rem;
      transition: background 0.2s, color 0.2s;
    }

    body.dark {
      background: #0d1a2b;
      color: #e3eaf5;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* header */
    .top-bar {
      background: #fff;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.02);
      border-bottom: 1px solid #e9eef3;
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(8px);
      background: rgba(255,255,255,0.85);
    }

    body.dark .top-bar {
      background: rgba(13,26,43,0.9);
      border-bottom-color: #1f344b;
    }

    .logo {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #1e3a6f;
    }

    body.dark .logo {
      color: #9bc0ff;
    }

    .logo i {
      color: #f59e0b;
      font-size: 2rem;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .theme-toggle, .menu-toggle {
      background: #f0f4fe;
      border: none;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #1e3a6f;
      transition: 0.2s;
    }

    body.dark .theme-toggle,
    body.dark .menu-toggle {
      background: #1e3146;
      color: #b8d4ff;
    }

    .theme-toggle:hover, .menu-toggle:hover {
      background: #f59e0b;
      color: #fff;
      transform: rotate(15deg);
    }

    /* container */
    .app-container {
      max-width: 720px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    /* post creator */
    .create-card {
      background: #fff;
      border-radius: 28px;
      padding: 1.8rem 1.8rem 1.5rem;
      box-shadow: 0 12px 30px rgba(0,0,0,0.04);
      border: 1px solid #eef3f9;
      margin-bottom: 2rem;
      transition: 0.2s;
    }

    body.dark .create-card {
      background: #132433;
      border-color: #1e344b;
    }

    .create-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.2rem;
    }

    .avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: linear-gradient(145deg, #1e3a6f, #2e5a9f);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.6rem;
      font-weight: 600;
      flex-shrink: 0;
      box-shadow: 0 6px 14px rgba(30,58,111,0.2);
    }

    .create-header h3 {
      font-weight: 600;
      font-size: 1.2rem;
    }

    .create-header p {
      font-size: 0.85rem;
      color: #6b7d99;
    }

    body.dark .create-header p {
      color: #9bb1cc;
    }

    .input-row {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .input-row input, .input-row textarea {
      width: 100%;
      padding: 0.9rem 1.2rem;
      border-radius: 24px;
      border: 1.5px solid #e2eaf2;
      background: #f9fbfe;
      font-family: inherit;
      font-size: 0.95rem;
      resize: vertical;
      outline: none;
      transition: 0.2s;
    }

    body.dark .input-row input,
    body.dark .input-row textarea {
      background: #1c2e40;
      border-color: #2b4057;
      color: #eef4ff;
    }

    .input-row input:focus, .input-row textarea:focus {
      border-color: #f59e0b;
      box-shadow: 0 0 0 4px rgba(245,158,11,0.1);
    }

    .media-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem;
      margin-top: 0.8rem;
    }

    .media-btn {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.5rem 1.1rem;
      background: #f0f4fe;
      border-radius: 40px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      border: none;
      color: #1e3a6f;
      transition: 0.15s;
    }

    body.dark .media-btn {
      background: #1f3348;
      color: #b6d0f0;
    }

    .media-btn i {
      color: #f59e0b;
    }

    .media-btn:hover {
      background: #f59e0b;
      color: #fff;
    }

    .media-btn:hover i {
      color: #fff;
    }

    .post-submit {
      margin-top: 1.2rem;
      display: flex;
      justify-content: flex-end;
    }

    .btn-primary {
      background: #1e3a6f;
      border: none;
      border-radius: 40px;
      padding: 0.8rem 2rem;
      font-weight: 600;
      font-size: 0.95rem;
      color: white;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 8px 18px rgba(30,58,111,0.2);
    }

    .btn-primary:hover {
      background: #2e5a9f;
      transform: translateY(-2px);
    }

    body.dark .btn-primary {
      background: #2e5a9f;
    }

    /* feed */
    .feed {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .post-card {
      background: #fff;
      border-radius: 28px;
      padding: 1.5rem 1.8rem 1.8rem;
      box-shadow: 0 8px 24px rgba(0,0,0,0.02);
      border: 1px solid #eef3f9;
      transition: 0.2s;
    }

    body.dark .post-card {
      background: #132433;
      border-color: #1f344b;
    }

    .post-header {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      margin-bottom: 1rem;
    }

    .post-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(145deg, #1e3a6f, #f59e0b);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
      font-size: 1.2rem;
    }

    .post-meta {
      flex: 1;
    }

    .post-meta h4 {
      font-weight: 600;
      font-size: 1rem;
    }

    .post-meta span {
      font-size: 0.75rem;
      color: #859bb3;
    }

    body.dark .post-meta span {
      color: #7e98b3;
    }

    .post-content {
      margin-bottom: 1rem;
    }

    .post-text {
      font-size: 0.98rem;
      margin-bottom: 0.8rem;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .post-image {
      max-width: 100%;
      border-radius: 20px;
      margin-top: 0.5rem;
      border: 1px solid #eef3f9;
      object-fit: cover;
      max-height: 360px;
      width: 100%;
      background: #f2f6fc;
    }

    .post-link-preview {
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      background: #f0f4fe;
      padding: 0.7rem 1.4rem;
      border-radius: 40px;
      margin-top: 0.6rem;
      font-size: 0.85rem;
      word-break: break-all;
      color: #1e3a6f;
      border: 1px solid #dce7f5;
      transition: 0.15s;
    }

    body.dark .post-link-preview {
      background: #1c2e40;
      border-color: #2b4057;
      color: #9bc0ff;
    }

    .post-link-preview i {
      color: #f59e0b;
    }

    .post-link-preview:hover {
      background: #e4ecfe;
    }

    .post-actions {
      display: flex;
      gap: 1.5rem;
      margin-top: 1.2rem;
      padding-top: 1rem;
      border-top: 1px solid #edf2f9;
    }

    body.dark .post-actions {
      border-top-color: #1f344b;
    }

    .action-btn {
      background: transparent;
      border: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      color: #5a6f88;
      cursor: pointer;
      transition: 0.15s;
      font-weight: 500;
    }

    body.dark .action-btn {
      color: #9bb1cc;
    }

    .action-btn i {
      font-size: 1.1rem;
      color: #859bb3;
      transition: 0.15s;
    }

    .action-btn:hover {
      color: #f59e0b;
    }

    .action-btn:hover i {
      color: #f59e0b;
    }

    .action-btn.liked i {
      color: #e74c3c;
    }

    .action-btn.liked {
      color: #e74c3c;
    }

    /* toast */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1e3a6f;
      color: white;
      padding: 1rem 2rem;
      border-radius: 60px;
      font-weight: 500;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      opacity: 0;
      pointer-events: none;
      transition: 0.25s;
      z-index: 999;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }

    /* media modal / hidden inputs */
    .hidden-input {
      display: none;
    }

    /* empty feed */
    .empty-feed {
      text-align: center;
      padding: 3rem 1rem;
      background: #fff;
      border-radius: 28px;
      color: #7f95b0;
      font-size: 1.1rem;
      border: 1px dashed #cbdae9;
    }

    body.dark .empty-feed {
      background: #132433;
      border-color: #1f344b;
      color: #8ba3c0;
    }

    /* responsive */
    @media (max-width: 560px) {
      .top-bar { padding: 0.8rem 1rem; }
      .create-card, .post-card { padding: 1.2rem; }
      .btn-primary { width: 100%; justify-content: center; }
      .media-row { justify-content: space-between; }
      .media-btn { flex: 1 0 40%; justify-content: center; }
      .post-link-preview { font-size: 0.75rem; }
    }
  </style>
</head>
<body>
  <!-- TOP BAR -->
  <div class="top-bar">
    <div class="logo">
      <i class="fas fa-share-alt"></i> Social<span style="color:#f59e0b;">Space</span>
    </div>
    <div class="header-actions">
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
        <i class="fas fa-moon"></i>
      </button>
    </div>
  </div>

  <div class="app-container">
    <!-- CREATE POST CARD -->
    <div class="create-card" data-aos="fade-up" data-aos-duration="500">
      <div class="create-header">
        <div class="avatar"><i class="fas fa-user-astronaut"></i></div>
        <div>
          <h3>Kabi Raj Bhatt</h3>
          <p>Share something cool</p>
        </div>
      </div>
      <div class="input-row">
        <textarea id="postText" rows="2" placeholder="What's on your mind? Write something..."></textarea>
        <input type="text" id="postLink" placeholder="🔗 Paste a link (optional)">
        
        <!-- hidden file input -->
        <input type="file" id="imageUpload" accept="image/*" class="hidden-input">
        
        <div class="media-row">
          <button class="media-btn" id="uploadImageBtn"><i class="fas fa-image"></i> Photo</button>
          <button class="media-btn" id="addLinkBtn"><i class="fas fa-link"></i> Link</button>
          <button class="media-btn" id="clearLinkBtn" style="background:#fee9e7;color:#c0392b;"><i class="fas fa-times"></i> Clear link</button>
        </div>
        <div id="imagePreviewName" style="font-size:0.8rem; color:#f59e0b; margin-top:4px;"></div>
      </div>
      <div class="post-submit">
        <button class="btn-primary" id="publishBtn"><i class="fas fa-paper-plane"></i> Publish</button>
      </div>
    </div>

    <!-- FEED -->
    <div class="feed" id="feedContainer">
      <!-- dynamic posts will be injected here by JavaScript -->
    </div>
  </div>

  <!-- toast notification -->
  <div class="toast" id="toast"><i class="fas fa-check-circle"></i> <span id="toastMsg">Post published!</span></div>

  <!-- AOS library -->
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    (function() {
      // ---------- AOS init ----------
      AOS.init({ once: true, duration: 600, easing: 'ease-out' });

      // ---------- state ----------
      let posts = [];               // each post: { id, text, link, imageData, likes, timestamp, likedByUser }
      let selectedImageData = null; // base64 string of uploaded image

      // DOM elements
      const feedContainer = document.getElementById('feedContainer');
      const postText = document.getElementById('postText');
      const postLink = document.getElementById('postLink');
      const imageUpload = document.getElementById('imageUpload');
      const uploadImageBtn = document.getElementById('uploadImageBtn');
      const addLinkBtn = document.getElementById('addLinkBtn');
      const clearLinkBtn = document.getElementById('clearLinkBtn');
      const publishBtn = document.getElementById('publishBtn');
      const imagePreviewName = document.getElementById('imagePreviewName');
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      const themeToggle = document.getElementById('themeToggle');

      // ---------- dark mode ----------
      if (localStorage.getItem('socialspace_theme') === 'dark') {
        document.body.classList.add('dark');
        themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
      }
      themeToggle.addEventListener('click', () => {
        document.body.classList.toggle('dark');
        const isDark = document.body.classList.contains('dark');
        themeToggle.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
        localStorage.setItem('socialspace_theme', isDark ? 'dark' : 'light');
      });

      // ---------- helpers ----------
      function showToast(msg, isError = false) {
        toastMsg.textContent = msg;
        toast.style.background = isError ? '#c0392b' : '#1e3a6f';
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2800);
      }

      // format time
      function timeAgo(timestamp) {
        const seconds = Math.floor((Date.now() - timestamp) / 1000);
        if (seconds < 10) return 'just now';
        if (seconds < 60) return seconds + 's ago';
        const minutes = Math.floor(seconds / 60);
        if (minutes < 60) return minutes + 'm ago';
        const hours = Math.floor(minutes / 60);
        if (hours < 24) return hours + 'h ago';
        const days = Math.floor(hours / 24);
        return days + 'd ago';
      }

      // escape HTML (for text safety)
      function escapeHTML(str) {
        return str.replace(/[&<>"]/g, function(m) {
          if (m === '&') return '&amp;';
          if (m === '<') return '&lt;';
          if (m === '>') return '&gt;';
          if (m === '"') return '&quot;';
          return m;
        });
      }

      // ---------- save to localStorage ----------
      function savePosts() {
        try {
          // if there are large base64 images, we might want to keep them but localStorage has limits.
          // we'll store only first 3 posts with images to be safe? no, just store everything.
          localStorage.setItem('socialspace_posts', JSON.stringify(posts));
        } catch (e) {
          if (e.name === 'QuotaExceededError') {
            showToast('Storage full — some images may not be saved.', true);
          }
        }
      }

      // ---------- load posts ----------
      function loadPosts() {
        const stored = localStorage.getItem('socialspace_posts');
        if (stored) {
          try {
            posts = JSON.parse(stored);
          } catch (e) {
            posts = [];
          }
        } else {
          // seed with two sample posts for demo
          posts = [
            {
              id: 'seed1',
              text: 'Just launched my new portfolio! Check it out 🚀',
              link: 'https://kabirajbhatt.com.np',
              imageData: null,
              likes: 12,
              timestamp: Date.now() - 86400000,
              likedByUser: false,
            },
            {
              id: 'seed2',
              text: 'Use coupon TOP1 on Brother Mart for Rs 300 OFF 🛒',
              link: 'https://brother-mart.com/?ref=KABI',
              imageData: null,
              likes: 8,
              timestamp: Date.now() - 3600000,
              likedByUser: false,
            }
          ];
        }
        renderFeed();
      }

      // ---------- render all posts ----------
      function renderFeed() {
        if (!feedContainer) return;
        if (!posts.length) {
          feedContainer.innerHTML = `<div class="empty-feed"><i class="fas fa-camera-retro" style="font-size:2.5rem; opacity:0.4; margin-bottom:1rem; display:block;"></i> No posts yet. Share your first photo or link!</div>`;
          return;
        }

        // sort by newest first
        const sorted = [...posts].sort((a, b) => b.timestamp - a.timestamp);

        feedContainer.innerHTML = sorted.map(post => {
          const likedClass = post.likedByUser ? 'liked' : '';
          const heartIcon = post.likedByUser ? 'fas fa-heart' : 'far fa-heart';
          
          // image
          let imageHTML = '';
          if (post.imageData) {
            imageHTML = `<img src="${post.imageData}" alt="post image" class="post-image" loading="lazy">`;
          }

          // link preview
          let linkHTML = '';
          if (post.link && post.link.trim() !== '') {
            const cleanLink = post.link.startsWith('http') ? post.link : `https://${post.link}`;
            linkHTML = `
              <a href="${escapeHTML(cleanLink)}" target="_blank" class="post-link-preview">
                <i class="fas fa-link"></i> ${escapeHTML(post.link.length > 45 ? post.link.substring(0, 45)+'…' : post.link)}
              </a>
            `;
          }

          // text content
          const textContent = post.text ? escapeHTML(post.text) : '';

          return `
            <div class="post-card" data-post-id="${post.id}" data-aos="fade-up" data-aos-duration="400">
              <div class="post-header">
                <div class="post-avatar"><i class="fas fa-user-circle"></i></div>
                <div class="post-meta">
                  <h4>Kabi Raj Bhatt</h4>
                  <span><i class="far fa-clock"></i> ${timeAgo(post.timestamp)}</span>
                </div>
              </div>
              <div class="post-content">
                ${textContent ? `<div class="post-text">${textContent}</div>` : ''}
                ${imageHTML}
                ${linkHTML}
              </div>
              <div class="post-actions">
                <button class="action-btn like-btn ${likedClass}" data-id="${post.id}">
                  <i class="${heartIcon}"></i> <span>${post.likes || 0}</span>
                </button>
                <button class="action-btn delete-btn" data-id="${post.id}">
                  <i class="fas fa-trash-alt"></i> Delete
                </button>
              </div>
            </div>
          `;
        }).join('');

        // attach event listeners to like/delete buttons
        document.querySelectorAll('.like-btn').forEach(btn => {
          btn.addEventListener('click', function(e) {
            e.stopPropagation();
            const id = this.dataset.id;
            toggleLike(id);
          });
        });

        document.querySelectorAll('.delete-btn').forEach(btn => {
          btn.addEventListener('click', function(e) {
            e.stopPropagation();
            const id = this.dataset.id;
            deletePost(id);
          });
        });
      }

      // ---------- toggle like ----------
      function toggleLike(postId) {
        const post = posts.find(p => p.id === postId);
        if (!post) return;
        if (post.likedByUser) {
          post.likes = Math.max(0, (post.likes || 0) - 1);
          post.likedByUser = false;
        } else {
          post.likes = (post.likes || 0) + 1;
          post.likedByUser = true;
        }
        savePosts();
        renderFeed();
      }

      // ---------- delete post ----------
      function deletePost(postId) {
        if (!confirm('Delete this post?')) return;
        posts = posts.filter(p => p.id !== postId);
        savePosts();
        renderFeed();
        showToast('Post deleted');
      }

      // ---------- publish new post ----------
      function publishPost() {
        const text = postText.value.trim();
        const link = postLink.value.trim();
        const imageData = selectedImageData; // base64 or null

        // validation: require at least text, link or image
        if (!text && !link && !imageData) {
          showToast('Write something, add a link or photo.', true);
          return;
        }

        const newPost = {
          id: 'post_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6),
          text: text,
          link: link,
          imageData: imageData,
          likes: 0,
          timestamp: Date.now(),
          likedByUser: false,
        };

        posts.push(newPost);
        savePosts();
        renderFeed();

        // reset form
        postText.value = '';
        postLink.value = '';
        selectedImageData = null;
        imageUpload.value = '';
        imagePreviewName.textContent = '';

        showToast('✨ Post published!');
      }

      // ---------- image upload ----------
      uploadImageBtn.addEventListener('click', () => {
        imageUpload.click();
      });

      imageUpload.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        // check size (limit 2MB for localStorage friendliness)
        if (file.size > 2 * 1024 * 1024) {
          showToast('Image too large (max 2MB)', true);
          imageUpload.value = '';
          return;
        }

        const reader = new FileReader();
        reader.onload = function(ev) {
          selectedImageData = ev.target.result; // base64
          imagePreviewName.textContent = `📎 ${file.name}`;
          showToast('Image attached');
        };
        reader.readAsDataURL(file);
      });

      // ---------- link helper (just focus on link input) ----------
      addLinkBtn.addEventListener('click', () => {
        postLink.focus();
        showToast('Paste your link in the field', false);
      });

      clearLinkBtn.addEventListener('click', () => {
        postLink.value = '';
        showToast('Link cleared');
      });

      // ---------- publish button ----------
      publishBtn.addEventListener('click', publishPost);

      // also allow enter+ctrl to publish? no, but we can keep simple.

      // ---------- initial load ----------
      loadPosts();
